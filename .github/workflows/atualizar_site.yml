name: Atualizacao Automatica do Site

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 urllib3 requests feedparser beautifulsoup4

      - name: 4. Rodar o script gerador
        run: |
          python3 gerador.py

      - name: 5. Salvar e enviar alterações (Auto-Commit)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica via robo 24/7" && git push)
