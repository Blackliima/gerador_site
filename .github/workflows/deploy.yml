name: Atualizar Portal Automaticamente

on:
  schedule:
    - cron: '0 6 * * *'  # Roda todo dia às 06:00 da manhã (ciclo de 24 horas)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests jinja2 urllib3

      - name: Executar gerador de site
        run: |
          python3 gerador.py

      - name: Enviar site atualizado para o GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bot de Atualizacao"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica diaria do portal [skip ci]" && git push origin main)
